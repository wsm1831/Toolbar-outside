<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>스크랩 창</title>
  <link rel="stylesheet" href="clip.css">
</head>
<body>
  <div class="bar">
    <button class="nav" data-a="back" aria-label="뒤로" title="뒤로">←</button>
    <button class="nav" data-a="fwd" aria-label="앞으로" title="앞으로">→</button>
    <button class="nav" data-a="reload" aria-label="새로고침" title="새로고침">↻</button>
    <input id="addr" type="text" spellcheck="false" autocomplete="off" aria-label="주소" placeholder="주소 또는 검색어">
    <span class="sep"></span>
    <label class="check" title="광고·메뉴·댓글을 빼고 글 본문만 저장"><input type="checkbox" id="body"> 본문만</label>
    <button class="btn ghost" id="txt" title="드래그해 선택한 부분, 선택이 없으면 본문을 복사">내용 복사</button>
    <button class="btn ghost" id="png">PNG 저장</button>
    <button class="btn" id="pdf">PDF 저장</button>
  </div>
  <script src="clip.js"></script>
</body>
</html>
