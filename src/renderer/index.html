<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>업무 툴바</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="pop" class="hit" hidden></div>
    <nav id="dock" class="hit" aria-label="업무 툴바">
      <div id="cats" role="tablist"></div>
      <div class="sep" id="sep-quick" aria-hidden="true" hidden></div>
      <div id="quick"></div>
      <div class="sep" aria-hidden="true"></div>
      <div id="clock" aria-live="off">
        <span id="timer-badge" hidden></span>
        <span id="clock-time"></span>
        <span id="clock-date"></span>
      </div>
      <button id="weather" class="weather" hidden>
        <span class="w-top"><span class="w-icon"></span><span class="w-temp"></span></span>
        <span class="w-bottom"><span class="w-city"></span><span class="w-air" hidden></span></span>
      </button>
      <div class="side-stack">
        <button id="btn-awake" class="mini mini-awake" aria-pressed="false" aria-label="화면 보호기 차단"><span class="lamp"></span></button>
        <button id="btn-settings" class="mini mini-settings" data-tip="설정" aria-label="설정"></button>
      </div>
    </nav>
  </div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" hidden></div>
  <script src="../shared/icons.js"></script>
  <script src="tools.js"></script>
  <script src="app.js"></script>
</body>
</html>
